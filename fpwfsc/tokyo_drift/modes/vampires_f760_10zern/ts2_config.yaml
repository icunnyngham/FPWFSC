# VAMPIRES F760, 10-Zernike mode — the telescope-sim configuration this
# mode's NN was trained against (reproduces the Oct 2023 training
# generator configuration parameter-for-parameter).
#
# The pupil generator is the byte-identical miles_pupil vendored at
# fpwfsc/tokyo_drift/miles_pupil.py (NOT fpwfsc.common.make_subaru_aperture,
# whose port has since diverged numerically from the training pupil).

pupil:
  resolution: 256
  extent: 8.1795            # 1.05 * 7.79 m

aperture:
  type: external_pupil
  module: fpwfsc.tokyo_drift.miles_pupil
  function: generate_pupil
  mode: field
  kwargs:
    outer: 0.9835858585858586   # 7.79 / 7.92
  area: 190.64472274970836      # legacy aperture_area (pi * 7.79^2)

correctors:
  zernike_dm:
    type: zernike
    n_modes: 10
    zernike_diameter: 7.79
    starting_mode: 2
    actuate_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [zernike_dm]

focal_planes:
  filter1:
    type: angular
    central_lam: 0.760e-6
    focal_extent: 0.768         # 6 mas/pix * 128 pix
    focal_res: 128
    fractional_bandwidth: 0.042105263157894736   # 32 nm / 760 nm
    num_samples: 5

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: max_intensity_norm
      - type: per_sample_norm

strehl_core_rad: null
