# VAMPIRES vector-vortex-coronagraph (charge 4), F750, 35-Zernike mode —
# the telescope-sim configuration this mode's NN (CB9WJU~4, 2024-05, the
# clean 128px VVC endpoint) was trained against.
#
# Matched to the training pkl 24-05-10_vampires_vvc_F750_35zern_multi_128focal.pkl
# and the validated eval bundle
# eval/runs/2024-05_vampires_vvc_F750_35zern_CB9WJU/. The coronagraph is in
# the SIM (not the net) — the FFModel architecture is identical to the
# no-coro 35-mode model. Aperture + Lyot come from the byte-identical
# miles_synthpsf vendored at fpwfsc/tokyo_drift/miles_synthpsf.py (a
# different, coro-era pupil generator than miles_pupil).
#
# CRITICAL: zernike_diameter is the RUNTIME auto-derived value from the
# legacy coro sampler (1.01 * max pairwise aperture distance) for THIS
# pupil (res 128) — NOT the dead 7.79 fixture literal. A 7.79 here mismatches
# the training sim by ~8% at nonzero actuation (validated by the eval bundle).

pupil:
  resolution: 128
  extent: 8.1795  # 1.05 * 7.79

aperture:
  type: external_pupil
  module: fpwfsc.tokyo_drift.miles_synthpsf
  function: generate_pupil
  mode: field
  kwargs:
    outer: 0.9835858585858586  # 7.79 / 7.92
  area: 190.6630               # pi * 7.79^2 (matches legacy aperture_area)

correctors:
  zernike_dm:
    type: zernike
    n_modes: 35
    zernike_diameter: 7.9430470876   # auto-derived (res 128); NOT the dead 7.79 literal
    starting_mode: 2
    actuate_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [zernike_dm]

coronagraph:
  type: vector_vortex
  charge: 4
  lyot:
    type: external_pupil
    module: fpwfsc.tokyo_drift.miles_synthpsf
    function: generate_pupil
    mode: field
    kwargs:
      outer: 0.9
      inner: 0.43
      scale: 1.4
      spider_scale: 1.6

focal_planes:
  filter1:
    type: angular
    central_lam: 0.748e-6
    focal_extent: 0.7552
    focal_res: 128
    fractional_bandwidth: 0.06417112299465241  # 48 nm / 748 nm
    num_samples: 3

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: per_sample_norm

strehl_core_rad: null
