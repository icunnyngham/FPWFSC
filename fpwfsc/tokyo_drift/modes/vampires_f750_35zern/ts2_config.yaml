# VAMPIRES F750, 35-Zernike mode — the telescope-sim configuration this
# mode's NN (CHP143~1, 2024-04 nocoro baseline) was trained against.
#
# Derived from vampires_f760_10zern/ts2_config.yaml with exactly three
# changes (verified against the training pkl
# 24-04-05_vampires_F750_35zern_multi_128focal.pkl and the validated eval
# bundle eval/runs/2024-04_vampires_F750_35zern_CHP143/):
#   central_lam          0.760e-6 -> 0.748e-6
#   fractional_bandwidth 0.0421   -> 0.06417112299465241  (48 nm / 748 nm)
#   zernike_dm.n_modes   10       -> 35
# Everything else (pupil, focal grid, num_samples, aperture, normalization,
# zernike_diameter/starting_mode/actuate_scale) is identical. The pupil
# generator is the byte-identical miles_pupil vendored at
# fpwfsc/tokyo_drift/miles_pupil.py (same SCExAO aperture as 2023-10).

pupil:
  resolution: 256
  extent: 8.1795            # 1.05 * 7.79 m

aperture:
  type: external_pupil
  module: fpwfsc.tokyo_drift.miles_pupil
  function: generate_pupil
  mode: field
  kwargs:
    outer: 0.9835858585858586   # 7.79 / 7.92
  area: 190.64472274970836      # legacy aperture_area (pi * 7.79^2)

correctors:
  zernike_dm:
    type: zernike
    n_modes: 35
    zernike_diameter: 7.79
    starting_mode: 2
    actuate_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [zernike_dm]

focal_planes:
  filter1:
    type: angular
    central_lam: 0.748e-6
    focal_extent: 0.768         # 6 mas/pix * 128 pix
    focal_res: 128
    fractional_bandwidth: 0.06417112299465241   # 48 nm / 748 nm
    num_samples: 5

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: max_intensity_norm
      - type: per_sample_norm

strehl_core_rad: null
