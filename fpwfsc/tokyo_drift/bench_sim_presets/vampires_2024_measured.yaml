name: vampires_2024_measured
description: >
  Fixed parameters (no randomness) matching the misalignment measured
  on VAMPIRES during the 2024 bench sessions: 235.4 deg image rotation,
  ~-6.25 deg DM rotation, 1.3x actuation scale. Deterministic, so it
  also serves the reload/determinism regression tests.
image_rotation_deg: {min: 235.4, max: 235.4}
dm_rotation_deg: {min: -6.25, max: -6.25}
crop_offset_px: {min: 7, max: 7}
dm_scale: {min: 1.3, max: 1.3}
dm_flip_x_probability: 0.0
dm_flip_y_probability: 0.0
