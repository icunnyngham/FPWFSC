# Tokyo Drift - bench (real hardware) defaults
[MODE]
    mode name           = vampires_f760_10zern
    calibration profile = None

[LOOP_SETTINGS]
    Plot              = True
    N iter            = 28
    gain              = 0.6
    leak factor       = 1.0
    strehl early stop = None

[DM]
    dm channel               = dm00disp04
    max peak to valley (um)  = 2.0
    max actuator stroke (um) = 1.0

[SIMULATION]
    # Unused on the bench; present so one spec validates both configs.
    bench sim preset = easy
    seed             = None

[IO]
    save_log = True
    log_path = ''
