# Tokyo Drift - bench (real hardware) defaults
[MODE]
    mode name           = vampires_f760_10zern
    calibration profile = None

[LOOP_SETTINGS]
    Plot              = True
    N iter            = 28
    gain              = 0.6
    leak factor       = 1.0
    strehl early stop = None
    predictor         = model
    strehl method     = vandam

[MODEL]
    initial move sigma = 0.01
    device             = cpu

[DM]
    dm channel               = dm00disp04
    max peak to valley (um)  = 2.0
    max actuator stroke (um) = 1.0

[ALIGNMENT]
    # 'bench sim preset' is unused on the bench (sim-only); present so one
    # spec validates both configs.
    bench sim preset = easy
    probe amplitude  = 0.3

[SIMULATION]
    seed              = None
    initial error rms = 0.15

[CAMERA CALIBRATION]
    background file = ''
    masterflat file = ''
    badpix file     = ''

[IO]
    save_log        = True
    log_path        = ''
    hitchhiker mode = False
    hitchhiker path = ''
